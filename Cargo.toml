[package]
name = "better-folder-size"
version = "0.1.0"
edition = "2021"
authors = ["BetterWindows"]
description = "Ultra-fast native Windows folder size scanner integrated with Explorer context menu"
license = "MIT"
readme = "README.md"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["progress-bar", "clipboard", "notice"] }
native-windows-derive = "1.0.5"
walkdir = "2.5.0"
rayon = "1.12.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
